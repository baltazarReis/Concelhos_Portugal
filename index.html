<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo dos Concelhos</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>

   <!-- INÍCIO: MENU INICIAL -->
<div id="menu-inicial">
  <div class="caixa-menu">
    <h1>Concelhos de Portugal</h1>
    <p>Identifica os 308 concelhos de Portugal no mapa.</p>
    <button id="btn-iniciar" class="btn-start">Iniciar Jogo</button>
  </div>
</div>
<!-- FIM: MENU INICIAL -->

  <!-- HUD Superior: Concelho / Pontuação / Tentativas / Tempo -->
  <!-- Desktop: canto superior direito. Mobile: barra fixa a toda a largura no topo. -->
  <div id="hud-superior" class="painel-hud painel-top-right">
    <div class="caixa-hud">
      <span class="label">Concelho</span>
      <span id="nome-concelho" class="valor-concelho">---</span>
    </div>
    <div class="caixa-hud">
      <span class="label">Pontuação</span>
      <span id="pontuacao" class="valor">0/308</span>
    </div>
    <div class="caixa-hud">
      <span class="label">Tentativas</span>
      <span id="tentativas" class="valor">0</span>
    </div>
    <div class="caixa-hud">
      <span class="label">Tempo</span>
      <span id="timer" class="valor">00:00</span>
    </div>
  </div>

  <!-- HUD Inferior: Ações do jogador -->
  <!-- Desktop: canto inferior esquerdo. Mobile: barra fixa a toda a largura no fundo. -->
  <div id="hud-inferior" class="painel-hud painel-bottom-left">
    <button id="btn-ajuda" class="btn btn-ajuda" title="Revelar pistas sobre o concelho&#10;Atenção: A pontuação deste concelho ficará indisponível.">
      ? Pistas
    </button>
    <button id="btn-skip" class="btn">Passar à frente</button>
  </div>

<!-- MODAL DE INFORMAÇÃO ADICIONAL DO CONCELHO -->
<div id="modal-info-concelho" class="escondido">
  <div class="conteudo-modal">
    <span id="fechar-modal">&times;</span>
    <h2 id="modal-titulo-concelho">Informação do Concelho</h2>
    
    <div class="corpo-modal">
      <div id="modal-imagem-container">
        <!-- Imagem carregada dinamicamente pelo JS -->
        <img id="modal-imagem" src="" alt="Imagem do concelho" class="escondido">
      </div>
      <p id="modal-descricao">Carregando informações do concelho...</p>
    </div>
  </div>
</div>

  <!-- HUD: Canto Inferior Direito -->
  <div id="tooltip-concelho"></div>

  <!-- Contentor do Mapa (Área de Pan/Zoom) -->
