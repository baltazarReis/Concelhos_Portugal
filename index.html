<!DOCTYPE html>
<html lang="pt">
  
  <head>

    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale =1.0">
    <title>Concelhos de Portugal</title>
    <link rel = "stylesheet" href = "style.css">
  
  </head>

  
  <body>

    <header>
      <h1>Concelhos de Portugal - Quiz</h1>
    </header>

    <main id="main_screen">

      <button id="start_button">Place Holder</button>
      
      <button onclick="changePage('main_screen', 'district_options_page')">Alterar Distritos</button> 

    </main>

    

    <div id="district_options_page" style = "display: none;">

      <h2 id="district_options_header">SELECIONE OS DISTRITOS PARA O QUIZ</h2>

      <div class="options_grid">


        <div class="option option_all">
          <input type="checkbox" id="Todos" name="toggle_all" checked>
          <label for="Todos">Todos</label>
        </div>
        
        <div class="option">
          <input type="checkbox" id="Aveiro" name="distritos_selecionados" checked>

        </div>

          <input type="checkbox" id="Beja" name="distritos_selecionados" checked>

        <div class="option">
          <input type="checkbox" id="Faro" name="distritos_selecionados" checked>
          <label for="Faro">Faro</label>
        </div>

        <div class="option">
          <input type="checkbox" id="Guarda" name="distritos_selecionados" checked>
          <label for="Guarda">Guarda</label>
        </div>

        <div class="option">
          <input type="checkbox" id="Leiria" name="distritos_selecionados" checked>
          <label for="Leiria">Leiria</label>
        </div>

        <div class="option">

        <div class="option">
          <input type="checkbox" id="Viana do Castelo" name="distritos_selecionados" checked>

        <div class="option">
          <input type="checkbox" id="Vila Real" name="distritos_selecionados" checked>

        <br>
        <div class="button-container">
          <button onclick="confirm_selection()">Confirmar e Voltar</button>
        </div>
        
      </div> <!-- página de seleção dos distritos -->
      
    </div> 
    


    <script src="script.js" type="module"></script>

  </body>
